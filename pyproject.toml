[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.coverage.run]
source = ["deskpilot", "eval"]
# Real Postgres + real OpenAI only, by design (AGENTS.md: no network calls
# in the default suite) — exercised by the opt-in ingest/eval runs instead.
omit = [
    "deskpilot/pgvector_store.py",
    "deskpilot/ingest.py",
    "deskpilot/cli.py",
    "eval/run_eval.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
